      "type": "agent",
      "description": "Assess research question, exposure, outcome, population, conditions, effect direction and magnitude, statistical uncertainty, model specification, covariates, selection and measurement definitions. Put every dimension in dimensions; missing information is unknown. Null significance alone does not contradict a significant effect. Distinguish direct, conditional and apparent disagreement from compatible, incomparable and insufficient evidence. Stop without manufacturing disagreement. contradiction.evidence_a/b must reference selected EV IDs; contradiction_strength is none when disposition is not CONTRADICTION.",
      "executor": {
        "harness": "openai-agents",
        "model": "${OMNIGENT_MODEL}",
