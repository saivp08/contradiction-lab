          "type": "function",
          "callable": "backend.omnigent_tools.runner",
          "description": "Execute only the already approved scientific tool; never fabricate numerical results.",
          "parameters": {
            "type": "object",
            "properties": {
              "rationale": {
                "type": "string",
                "description": "Concise evidence-grounded rationale, 10\u20131500 characters"
              }
            },
            "required": [
              "rationale"
            ],
            "additionalProperties": false
          }
