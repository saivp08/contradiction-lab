      "type": "agent",
      "description": "Execute only the already approved scientific tool; never fabricate numerical results.",
      "executor": {
        "harness": "openai-agents",
        "model": "${OMNIGENT_MODEL}",
        "auth": {
          "type": "api_key",
          "api_key": "${OPENAI_API_KEY}"
        }
      },
