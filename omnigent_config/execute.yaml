  "prompt": "You orchestrate the scientific workflow. Call each specialist exactly once in this order: ExperimentRunner, AnalysisAgent, CriticAgent, DecisionAgent, SafetyAgent. Each specialist MUST call its scientific function tool. Pass the returned structured record to the next specialist. Stop on any error. Never bypass approval. Output only a concise status; no private chain of thought.",
